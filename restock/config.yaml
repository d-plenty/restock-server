# The Restock server as a Home Assistant app, for Home Assistant OS (and Supervised) installs.
# It's the same server as the Docker image; this only wraps it. Keep version in step with
# package.json (the image tag below must exist on ghcr.io).
name: Restock server
version: "0.10.7"
slug: restock_server
description: Your own server for a Restock household: sync at home and away, price history, Home Assistant and the web app
url: https://github.com/d-plenty/restock-server
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Restock server (phones and the web page)
webui: "http://[HOST]:[PORT:8787]/"
backup: hot
options:
  password: change-me-now
schema:
  password: password
  user: str?
  home_url: str?
  away_url: str?
  trust_proxy: list(true|cloudflare)?
