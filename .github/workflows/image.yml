name: Server image

# Builds the Restock server image for amd64 and arm64 and publishes it to the GitHub Container
# Registry as ghcr.io/<owner>/restock-server:<version> and :latest. Runs when a release is
# published, when a v* tag is pushed, or by hand from the Actions tab.
#
# The web app and the Restock core come from the Restock repo at the tag in the Dockerfile
# (RESTOCK_REF, which must be v<package.json's version>), unless a manual run names another one.

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      restock_ref:
        description: 'Restock tag or branch to build the web app from (blank: the one in the Dockerfile)'
        required: false
        default: ''
      latest:
        description: 'Also tag it :latest'
        type: boolean
        default: true

permissions:
  contents: read

# A release and its tag both start a run; one build per version is enough.
concurrency:
  group: server-image-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
      # The tests need the Restock core (core/restock-core.mjs), built from Restock at the Dockerfile's RESTOCK_REF.
      - name: Fetch Restock for the core
        env:
          REF_INPUT: ${{ inputs.restock_ref }}
        run: |
          set -eu
          if [ -n "$REF_INPUT" ] && [[ ! "$REF_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]]; then
            echo "::error::restock_ref must be a tag or branch name."
            exit 1
          fi
          ref="${REF_INPUT:-$(sed -n 's/^ARG RESTOCK_REF=//p' Dockerfile)}"
          git clone --depth 1 --branch "$ref" https://github.com/d-plenty/Restock "$RUNNER_TEMP/restock"
          (cd "$RUNNER_TEMP/restock" && npm ci --no-audit --no-fund)
      - run: npm test
        env:
          RESTOCK_DIR: ${{ runner.temp }}/restock

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name and tags
        id: meta
        env:
          REF: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
          WANT_LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.latest }}
          REF_INPUT: ${{ inputs.restock_ref }}
        run: |
          set -eu
          # Only ever a plain ref (it goes into the build's arguments, one per line).
          if [ -n "$REF_INPUT" ] && [[ ! "$REF_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]]; then
            echo "::error::restock_ref must be a tag or branch name."
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/restock-server"
          pkg_version="$(node -p 'require("./package.json").version')"
          # The Home Assistant app (restock/) must name the same version and image tag.
          app_version="$(sed -n 's/^version: "\(.*\)"$/\1/p' restock/config.yaml)"
          if [ "$app_version" != "$pkg_version" ] || ! grep -q "^FROM ghcr.io/d-plenty/restock-server:${pkg_version}\$" restock/Dockerfile; then
            echo "::error::restock/config.yaml and restock/Dockerfile must say ${pkg_version}, like package.json."
            exit 1
          fi
          # The web app and the core come from Restock at the same version (unless a manual run names another).
          if [ -z "$REF_INPUT" ] && ! grep -q "^ARG RESTOCK_REF=v${pkg_version}\$" Dockerfile; then
            echo "::error::The Dockerfile's RESTOCK_REF must be v${pkg_version}, like package.json."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [[ ! "$REF" =~ ^v[0-9] ]]; then
            version="$pkg_version"
          else
            version="${REF#v}"
            if [ "$version" != "$pkg_version" ] && [[ "$version" != "$pkg_version"-* ]]; then
              echo "::error::The tag says $version but package.json says $pkg_version. Bump package.json first."
              exit 1
            fi
          fi
          # Built from another Restock ref than the release's: never under the release's own tag or
          # :latest (the Home Assistant app pulls restock-server:<version>).
          want_ref="$(sed -n 's/^ARG RESTOCK_REF=//p' Dockerfile)"
          if [ -n "$REF_INPUT" ] && [ "$REF_INPUT" != "$want_ref" ]; then
            version="${version}-restock-$(printf '%s' "$REF_INPUT" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          tags="${image}:${version}"
          # :latest only for a full release (not 0.9.3-rc1, not a pre-release).
          if [ "$WANT_LATEST" = "true" ] && [ "$PRERELEASE" != "true" ] && [[ "$version" != *-* ]]; then
            tags="${tags},${image}:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            WEB=fetch
            ${{ inputs.restock_ref && format('RESTOCK_REF={0}', inputs.restock_ref) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
