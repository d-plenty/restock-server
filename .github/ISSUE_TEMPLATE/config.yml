blank_issues_enabled: false
contact_links:
  - name: A problem with the Restock app on a phone
    url: https://github.com/d-plenty/Restock/issues/new/choose
    about: Problems in the app itself (the pantry, the list, prices, a shop that stopped working) go in Restock's own issues.
  - name: Idea or suggestion
    url: https://github.com/d-plenty/Restock/discussions/categories/ideas
    about: Share an idea for Restock or the server in Discussions.
  - name: Question or help
    url: https://github.com/d-plenty/Restock/discussions/categories/q-a
    about: Not sure if it's a bug? Ask here first.
  - name: Security problem
    url: https://github.com/d-plenty/Restock/security/advisories/new
    about: Please report security problems privately, not as a public issue.
